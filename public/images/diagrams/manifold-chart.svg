<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Local coordinate chart</title><desc id="desc">A patch of a curved manifold maps to coordinates in a plane. Coordinates describe the patch without requiring a flat intrinsic geometry.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M104 234Q120 51 305 93L319 245Q207 194 104 234" fill="#e4f3f3" stroke="#087f8c" stroke-width="2"/><path d="M157 163Q180 122 235 141L266 196Q205 221 166 204Z" fill="#c7e4e5" stroke="#087f8c" stroke-width="2"/><text x="123" y="83" fill="#243d48" font-size="22" text-anchor="middle">M</text><text x="217" y="185" fill="#243d48" font-size="22" text-anchor="middle">U</text><path d="M331,168L418,168" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(418,168) rotate(0)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="370" y="143" fill="#c65a23" font-size="22" text-anchor="middle">φ</text><rect x="475" y="115" width="134" height="125" rx="8" fill="#e4f3f3"/><path d="M450,272L653,272" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(653,272) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M450,272L450,68" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(450,68) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="651" y="300" fill="#243d48" font-size="22" text-anchor="middle">x¹</text><text x="430" y="67" fill="#243d48" font-size="22" text-anchor="middle">x²</text><text x="540" y="184" fill="#243d48" font-size="22" text-anchor="middle">φ(U)</text><text x="360" y="332" fill="#243d48" font-size="22" text-anchor="middle">φ : U ⊂ M → ℝ²</text></g></svg>
