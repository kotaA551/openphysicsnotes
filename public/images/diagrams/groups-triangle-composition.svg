<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="groups_triangle_composition_title groups_triangle_composition_desc">
<title id="groups_triangle_composition_title">Noncommuting symmetries of an equilateral triangle</title>
<desc id="groups_triangle_composition_desc">Material vertices initially occupy slots 1 at the top, 2 at the lower right, and 3 at the lower left. The clockwise rotation r=(123) followed by the reflection s=(23) gives sr=(13). Reversing the order gives rs=(12). Products act on the rightmost factor first. Colored vertex labels are carried by each transformation.</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#155fc0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b54c13"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7543ad"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#087760"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#52647b"/></marker></defs>
<rect width="840" height="500" rx="18" fill="#f8fafc"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round" xml:space="preserve"><text x="420" y="39" font-size="27" fill="#14283f" text-anchor="middle" >r = (123)       s = (23)</text><path d="M105.000,88.000 L153.497,172.000 L56.503,172.000 L105.000,88.000" fill="#e9eff8" stroke="#a9b8c9" stroke-width="2"/><circle cx="105" cy="88" r="16" fill="#155fc0"/><text x="105" y="94" font-size="20" fill="#fff" text-anchor="middle" >1</text><circle cx="153.4974" cy="172" r="16" fill="#b54c13"/><text x="153.4974" y="178" font-size="20" fill="#fff" text-anchor="middle" >2</text><circle cx="56.5026" cy="172" r="16" fill="#7543ad"/><text x="56.5026" y="178" font-size="20" fill="#fff" text-anchor="middle" >3</text><path d="M365.000,88.000 L413.497,172.000 L316.503,172.000 L365.000,88.000" fill="#e9eff8" stroke="#a9b8c9" stroke-width="2"/><circle cx="365" cy="88" r="16" fill="#7543ad"/><text x="365" y="94" font-size="20" fill="#fff" text-anchor="middle" >3</text><circle cx="413.49739999999997" cy="172" r="16" fill="#155fc0"/><text x="413.49739999999997" y="178" font-size="20" fill="#fff" text-anchor="middle" >1</text><circle cx="316.50260000000003" cy="172" r="16" fill="#b54c13"/><text x="316.50260000000003" y="178" font-size="20" fill="#fff" text-anchor="middle" >2</text><path d="M625.000,88.000 L673.497,172.000 L576.503,172.000 L625.000,88.000" fill="#e9eff8" stroke="#a9b8c9" stroke-width="2"/><circle cx="625" cy="88" r="16" fill="#7543ad"/><text x="625" y="94" font-size="20" fill="#fff" text-anchor="middle" >3</text><circle cx="673.4974" cy="172" r="16" fill="#b54c13"/><text x="673.4974" y="178" font-size="20" fill="#fff" text-anchor="middle" >2</text><circle cx="576.5026" cy="172" r="16" fill="#155fc0"/><text x="576.5026" y="178" font-size="20" fill="#fff" text-anchor="middle" >1</text><line x1="177" y1="137" x2="285" y2="137" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)" /><text x="230" y="114" font-size="27" fill="#155fc0" text-anchor="middle" >r</text><line x1="437" y1="137" x2="545" y2="137" stroke="#b54c13" stroke-width="3" marker-end="url(#orange-arrow)" /><text x="490" y="114" font-size="27" fill="#b54c13" text-anchor="middle" >s</text><text x="105" y="210" font-size="23" fill="#14283f" text-anchor="middle" >e</text><text x="365" y="210" font-size="23" fill="#14283f" text-anchor="middle" >r</text><text x="625" y="210" font-size="23" fill="#14283f" text-anchor="middle" >sr = (13)</text><path d="M105.000,257.000 L153.497,341.000 L56.503,341.000 L105.000,257.000" fill="#e9eff8" stroke="#a9b8c9" stroke-width="2"/><circle cx="105" cy="257" r="16" fill="#155fc0"/><text x="105" y="263" font-size="20" fill="#fff" text-anchor="middle" >1</text><circle cx="153.4974" cy="341" r="16" fill="#b54c13"/><text x="153.4974" y="347" font-size="20" fill="#fff" text-anchor="middle" >2</text><circle cx="56.5026" cy="341" r="16" fill="#7543ad"/><text x="56.5026" y="347" font-size="20" fill="#fff" text-anchor="middle" >3</text><path d="M365.000,257.000 L413.497,341.000 L316.503,341.000 L365.000,257.000" fill="#e9eff8" stroke="#a9b8c9" stroke-width="2"/><circle cx="365" cy="257" r="16" fill="#155fc0"/><text x="365" y="263" font-size="20" fill="#fff" text-anchor="middle" >1</text><circle cx="413.49739999999997" cy="341" r="16" fill="#7543ad"/><text x="413.49739999999997" y="347" font-size="20" fill="#fff" text-anchor="middle" >3</text><circle cx="316.50260000000003" cy="341" r="16" fill="#b54c13"/><text x="316.50260000000003" y="347" font-size="20" fill="#fff" text-anchor="middle" >2</text><path d="M625.000,257.000 L673.497,341.000 L576.503,341.000 L625.000,257.000" fill="#e9eff8" stroke="#a9b8c9" stroke-width="2"/><circle cx="625" cy="257" r="16" fill="#b54c13"/><text x="625" y="263" font-size="20" fill="#fff" text-anchor="middle" >2</text><circle cx="673.4974" cy="341" r="16" fill="#155fc0"/><text x="673.4974" y="347" font-size="20" fill="#fff" text-anchor="middle" >1</text><circle cx="576.5026" cy="341" r="16" fill="#7543ad"/><text x="576.5026" y="347" font-size="20" fill="#fff" text-anchor="middle" >3</text><line x1="177" y1="306" x2="285" y2="306" stroke="#b54c13" stroke-width="3" marker-end="url(#orange-arrow)" /><text x="230" y="283" font-size="27" fill="#b54c13" text-anchor="middle" >s</text><line x1="437" y1="306" x2="545" y2="306" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)" /><text x="490" y="283" font-size="27" fill="#155fc0" text-anchor="middle" >r</text><text x="105" y="379" font-size="23" fill="#14283f" text-anchor="middle" >e</text><text x="365" y="379" font-size="23" fill="#14283f" text-anchor="middle" >s</text><text x="625" y="379" font-size="23" fill="#14283f" text-anchor="middle" >rs = (12)</text><rect x="72" y="413" width="696" height="61" rx="12" fill="#fff" stroke="#a9b8c9" stroke-width="1.5"/><text x="420" y="452" font-size="27" fill="#14283f" text-anchor="middle" >(sr)(v) = s(r(v))       sr ≠ rs</text></g>
