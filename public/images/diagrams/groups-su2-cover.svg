<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="groups_su2_cover_title groups_su2_cover_desc">
<title id="groups_su2_cover_title">Two SU(2) lifts for every spatial rotation</title>
<desc id="groups_su2_cover_desc">This is a parameter track, not a geometric picture of the three dimensional manifold SU(2). Along U(theta)=exp(-i theta sigma_3/2), the states at theta=0, pi, 2pi, 3pi, 4pi are I, -i sigma_3, -I, i sigma_3, I. Their images in SO(3) are I_3, R_z(pi), I_3, R_z(pi), I_3. Thus U and -U project to the same rotation and a spinor returns after 4pi.</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#155fc0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b54c13"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7543ad"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#087760"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#52647b"/></marker></defs>
<rect width="840" height="500" rx="18" fill="#f8fafc"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round" xml:space="preserve"><text x="420" y="38" font-size="29" fill="#155fc0" text-anchor="middle" >U(θ) = exp(−iθσ₃/2)</text><text x="420" y="76" font-size="25" fill="#087760" text-anchor="middle" >p(U(θ)) = Rz(θ)</text><line x1="95" y1="160" x2="765" y2="160" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)" /><line x1="95" y1="327" x2="765" y2="327" stroke="#087760" stroke-width="3" marker-end="url(#green-arrow)" /><circle cx="100" cy="160" r="8" fill="#155fc0"/><text x="100" y="135" font-size="24" fill="#155fc0" text-anchor="middle" >I</text><line x1="100" y1="188" x2="100" y2="281" stroke="#52647b" stroke-width="2" marker-end="url(#muted-arrow)" stroke-dasharray="5 5"/><text x="115" y="245" font-size="20" fill="#52647b" text-anchor="middle" >p</text><circle cx="100" cy="327" r="8" fill="#087760"/><text x="100" y="309" font-size="23" fill="#087760" text-anchor="middle" >I₃</text><text x="100" y="370" font-size="22" fill="#52647b" text-anchor="middle" >0</text><circle cx="260" cy="160" r="8" fill="#155fc0"/><text x="260" y="135" font-size="24" fill="#155fc0" text-anchor="middle" >−iσ₃</text><line x1="260" y1="188" x2="260" y2="281" stroke="#52647b" stroke-width="2" marker-end="url(#muted-arrow)" stroke-dasharray="5 5"/><text x="275" y="245" font-size="20" fill="#52647b" text-anchor="middle" >p</text><circle cx="260" cy="327" r="8" fill="#087760"/><text x="260" y="309" font-size="23" fill="#087760" text-anchor="middle" >Rz(π)</text><text x="260" y="370" font-size="22" fill="#52647b" text-anchor="middle" >π</text><circle cx="420" cy="160" r="8" fill="#155fc0"/><text x="420" y="135" font-size="24" fill="#155fc0" text-anchor="middle" >−I</text><line x1="420" y1="188" x2="420" y2="281" stroke="#52647b" stroke-width="2" marker-end="url(#muted-arrow)" stroke-dasharray="5 5"/><text x="435" y="245" font-size="20" fill="#52647b" text-anchor="middle" >p</text><circle cx="420" cy="327" r="8" fill="#087760"/><text x="420" y="309" font-size="23" fill="#087760" text-anchor="middle" >I₃</text><text x="420" y="370" font-size="22" fill="#52647b" text-anchor="middle" >2π</text><circle cx="580" cy="160" r="8" fill="#155fc0"/><text x="580" y="135" font-size="24" fill="#155fc0" text-anchor="middle" >iσ₃</text><line x1="580" y1="188" x2="580" y2="281" stroke="#52647b" stroke-width="2" marker-end="url(#muted-arrow)" stroke-dasharray="5 5"/><text x="595" y="245" font-size="20" fill="#52647b" text-anchor="middle" >p</text><circle cx="580" cy="327" r="8" fill="#087760"/><text x="580" y="309" font-size="23" fill="#087760" text-anchor="middle" >Rz(π)</text><text x="580" y="370" font-size="22" fill="#52647b" text-anchor="middle" >3π</text><circle cx="740" cy="160" r="8" fill="#155fc0"/><text x="740" y="135" font-size="24" fill="#155fc0" text-anchor="middle" >I</text><line x1="740" y1="188" x2="740" y2="281" stroke="#52647b" stroke-width="2" marker-end="url(#muted-arrow)" stroke-dasharray="5 5"/><text x="755" y="245" font-size="20" fill="#52647b" text-anchor="middle" >p</text><circle cx="740" cy="327" r="8" fill="#087760"/><text x="740" y="309" font-size="23" fill="#087760" text-anchor="middle" >I₃</text><text x="740" y="370" font-size="22" fill="#52647b" text-anchor="middle" >4π</text><text x="788" y="373" font-size="24" fill="#52647b" text-anchor="middle" >θ</text><rect x="61" y="413" width="718" height="65" rx="12" fill="#fff" stroke="#a9b8c9" stroke-width="1.5"/><text x="420" y="453" font-size="26" fill="#14283f" text-anchor="middle" >U(θ + 2π) = −U(θ)       p(U) = p(−U)</text></g>
</svg>
