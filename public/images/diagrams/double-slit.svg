<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Double slit interference</title><desc id="desc">Two slits lead to bright fringes when their path difference is an integer wavelength. Fringes are schematic.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M210,45L210,137" fill="none" stroke="#243d48" stroke-width="6"/><path d="M210,155L210,205" fill="none" stroke="#243d48" stroke-width="6"/><path d="M210,223L210,315" fill="none" stroke="#243d48" stroke-width="6"/><path d="M590,45L590,315" fill="none" stroke="#243d48" stroke-width="5"/><circle cx="210" cy="146" r="5" fill="#087f8c"/><circle cx="210" cy="214" r="5" fill="#087f8c"/><path d="M210,146L590,105" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M210,214L590,105" fill="none" stroke="#c65a23" stroke-width="2"/><text x="387" y="107" fill="#087f8c" font-size="22" text-anchor="middle">r₁</text><text x="395" y="190" fill="#c65a23" font-size="22" text-anchor="middle">r₂</text><text x="180" y="188" fill="#243d48" font-size="22" text-anchor="middle">d</text><text x="375" y="335" fill="#243d48" font-size="22" text-anchor="middle">Δr = d sin θ = mλ</text><rect x="612" y="56" width="35" height="19" rx="8" fill="#087f8c"/><rect x="612" y="85" width="35" height="19" rx="8" fill="#edf4f4"/><rect x="612" y="114" width="35" height="19" rx="8" fill="#087f8c"/><rect x="612" y="143" width="35" height="19" rx="8" fill="#edf4f4"/><rect x="612" y="172" width="35" height="19" rx="8" fill="#087f8c"/><rect x="612" y="201" width="35" height="19" rx="8" fill="#edf4f4"/><rect x="612" y="230" width="35" height="19" rx="8" fill="#087f8c"/><rect x="612" y="259" width="35" height="19" rx="8" fill="#edf4f4"/><rect x="612" y="288" width="35" height="19" rx="8" fill="#087f8c"/></g></svg>
