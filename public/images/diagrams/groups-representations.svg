<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="groups_representations_title groups_representations_desc">
<title id="groups_representations_title">Direct sum and tensor product representations</title>
<desc id="groups_representations_desc">The direct sum V plus W stores one vector from V and one from W as separate blocks. The tensor product V tensor W has basis e_i tensor f_j for every pair of basis vectors. Both have dimension four when each factor has dimension two, but the group acts by a block diagonal matrix in the first case and a Kronecker product in the second. For two SU(2) doublets the tensor product splits into a symmetric triplet and an antisymmetric singlet, shown with normalized mixed states.</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#155fc0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b54c13"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7543ad"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#087760"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#52647b"/></marker></defs>
<rect width="840" height="500" rx="18" fill="#f8fafc"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round" xml:space="preserve"><text x="210" y="41" font-size="30" fill="#155fc0" text-anchor="middle" >V ⊕ W</text><text x="630" y="41" font-size="30" fill="#7543ad" text-anchor="middle" >V ⊗ W</text><rect x="74" y="64" width="272" height="72" rx="12" fill="#e7effc" stroke="#155fc0" stroke-width="1.5"/><text x="210" y="109" font-size="26" fill="#155fc0" text-anchor="middle" >(v₁, v₂)</text><rect x="74" y="147" width="272" height="72" rx="12" fill="#f5eaff" stroke="#7543ad" stroke-width="1.5"/><text x="210" y="192" font-size="26" fill="#7543ad" text-anchor="middle" >(w₁, w₂)</text><rect x="474" y="64" width="150" height="72" rx="12" fill="#e7effc" stroke="#155fc0" stroke-width="1.5"/><text x="549" y="108" font-size="23" fill="#14283f" text-anchor="middle" >e₁ ⊗ f₁</text><rect x="635" y="64" width="150" height="72" rx="12" fill="#edf6f2" stroke="#087760" stroke-width="1.5"/><text x="710" y="108" font-size="23" fill="#14283f" text-anchor="middle" >e₁ ⊗ f₂</text><rect x="474" y="147" width="150" height="72" rx="12" fill="#fff0e8" stroke="#b54c13" stroke-width="1.5"/><text x="549" y="191" font-size="23" fill="#14283f" text-anchor="middle" >e₂ ⊗ f₁</text><rect x="635" y="147" width="150" height="72" rx="12" fill="#f5eaff" stroke="#7543ad" stroke-width="1.5"/><text x="710" y="191" font-size="23" fill="#14283f" text-anchor="middle" >e₂ ⊗ f₂</text><text x="210" y="257" font-size="23" fill="#14283f" text-anchor="middle" >dim(V ⊕ W) = 2 + 2 = 4</text><text x="630" y="257" font-size="23" fill="#14283f" text-anchor="middle" >dim(V ⊗ W) = 2 × 2 = 4</text><text x="210" y="295" font-size="24" fill="#155fc0" text-anchor="middle" >ρV(g) ⊕ ρW(g)</text><text x="630" y="295" font-size="24" fill="#7543ad" text-anchor="middle" >ρV(g) ⊗ ρW(g)</text><line x1="51" y1="322" x2="790" y2="322" stroke="#a9b8c9" stroke-width="2" /><text x="420" y="357" font-size="27" fill="#14283f" text-anchor="middle" >SU(2) :  2 ⊗ 2 = 3 ⊕ 1</text><rect x="34" y="379" width="496" height="88" rx="12" fill="#e7effc" stroke="#155fc0" stroke-width="1.5"/><text x="282" y="408" font-size="23" fill="#155fc0" text-anchor="middle" >3</text><text x="282" y="444" font-size="23" fill="#14283f" text-anchor="middle" >↑↑     (↑↓ + ↓↑)/√2     ↓↓</text><rect x="550" y="379" width="256" height="88" rx="12" fill="#f5eaff" stroke="#7543ad" stroke-width="1.5"/><text x="678" y="408" font-size="23" fill="#7543ad" text-anchor="middle" >1</text><text x="678" y="444" font-size="22" fill="#14283f" text-anchor="middle" >(↑↓ − ↓↑)/√2</text></g>
</svg>
