<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Moving light clock</title><desc id="desc">The same light pulse travels vertically in the clock rest frame and diagonally in a frame where the clock moves horizontally.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M92,85L218,85" fill="none" stroke="#243d48" stroke-width="4"/><path d="M92,266L218,266" fill="none" stroke="#243d48" stroke-width="4"/><path d="M155,261L155,90" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(155,90) rotate(-90)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="105" y="184" fill="#243d48" font-size="22" text-anchor="middle">L</text><text x="155" y="325" fill="#243d48" font-size="20" text-anchor="middle">cΔτ/2 = L</text><path d="M346,266L458,266" fill="none" stroke="#243d48" stroke-width="4"/><path d="M512,85L624,85" fill="none" stroke="#243d48" stroke-width="4"/><path d="M402,261L568,90" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(568,90) rotate(-45.850023381091084)" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M402,85L402,266" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><path d="M402,85L568,85" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><text x="384" y="181" fill="#243d48" font-size="22" text-anchor="middle">L</text><text x="480" y="62" fill="#243d48" font-size="22" text-anchor="middle">vΔt/2</text><text x="536" y="197" fill="#c65a23" font-size="22" text-anchor="middle">cΔt/2</text><text x="492" y="325" fill="#243d48" font-size="20" text-anchor="middle">Δt = γΔτ</text></g></svg>
