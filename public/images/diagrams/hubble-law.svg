<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Hubble law</title><desc id="desc">In the nearby universe, recession speed is proportional to proper distance at a common cosmic time. The line is a schematic relation, not measured data.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M80,290L660,290" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(660,290) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M80,290L80,40" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(80,40) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="672" y="320" fill="#243d48" font-size="22" text-anchor="middle">d</text><text x="52" y="35" fill="#243d48" font-size="22" text-anchor="middle">v</text><path d="M80,290L610,68" fill="none" stroke="#087f8c" stroke-width="4"/><text x="405" y="99" fill="#243d48" font-size="22" text-anchor="middle">v = H₀d</text><path d="M285,290L285,204" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><path d="M490,290L490,118" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><circle cx="285" cy="204" r="6" fill="#087f8c"/><circle cx="490" cy="118" r="6" fill="#087f8c"/></g></svg>
