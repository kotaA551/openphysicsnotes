<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Cosmic density scaling</title><desc id="desc">Radiation and nonrelativistic matter dilute as the universe expands, whereas a cosmological constant has constant energy density. Both axes are logarithmic.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M80,290L660,290" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(660,290) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M80,290L80,40" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(80,40) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="672" y="320" fill="#243d48" font-size="22" text-anchor="middle">ln a</text><text x="52" y="35" fill="#243d48" font-size="22" text-anchor="middle">ln ρ</text><path d="M110,57L595,258" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M110,106L595,256" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M110,228L595,228" fill="none" stroke="#7254a3" stroke-width="3"/><text x="247" y="68" fill="#c65a23" font-size="22" text-anchor="middle">ρᵣ ∝ a⁻⁴</text><text x="257" y="153" fill="#087f8c" font-size="22" text-anchor="middle">ρₘ ∝ a⁻³</text><text x="470" y="211" fill="#7254a3" font-size="22" text-anchor="middle">ρΛ = const.</text></g></svg>
