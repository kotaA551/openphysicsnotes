<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Worldline and worldsheet</title><desc id="desc">A point particle traces a one dimensional worldline; a string traces a two dimensional worldsheet parametrized by sigma and tau.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="127" cy="235" r="6" fill="#243d48"/><path d="M127.00,235.00 L139.00,196.00 L121.00,152.00 L141.00,107.00 L135.00,67.00" fill="none" stroke="#243d48" stroke-width="3"/><text x="128" y="317" fill="#243d48" font-size="22" text-anchor="middle">x^μ(τ)</text><path d="M321 235Q386 204 451 235L491 65Q426 34 361 65Z" fill="#e4f3f3" stroke="#087f8c" stroke-width="2"/><path d="M321 235q65 -31 130 0" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M331 192.5q65 -31 130 0" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M341 150q65 -31 130 0" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M351 107.5q65 -31 130 0" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M361 65q65 -31 130 0" fill="none" stroke="#087f8c" stroke-width="2"/><text x="405" y="317" fill="#243d48" font-size="22" text-anchor="middle">X^μ(σ, τ)</text><path d="M600,263L600,75" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(600,75) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="623" y="70" fill="#243d48" font-size="22" text-anchor="middle">τ</text></g></svg>
