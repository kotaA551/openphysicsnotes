<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Changing magnetic flux</title><desc id="desc">A magnet moves toward a loop, changing its magnetic flux. Faraday law relates the induced emf to the rate of flux change.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="120" y="134" width="150" height="70" rx="8" fill="#fae9dd"/><text x="158" y="178" fill="#243d48" font-size="22" text-anchor="middle">S</text><text x="230" y="178" fill="#c65a23" font-size="22" text-anchor="middle">N</text><path d="M286,168L363,168" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(363,168) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="326" y="139" fill="#243d48" font-size="22" text-anchor="middle">v</text><ellipse cx="450" cy="173" rx="40" ry="103" fill="none" stroke="#087f8c" stroke-width="5"/><path d="M378,174L555,174" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(555,174) rotate(0)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="574" y="181" fill="#c65a23" font-size="22" text-anchor="middle">B</text><text x="361" y="325" fill="#243d48" font-size="22" text-anchor="middle">ε = −dΦB/dt</text></g></svg>
