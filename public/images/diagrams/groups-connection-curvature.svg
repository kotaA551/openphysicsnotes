"none" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="210" y="105" font-size="22" fill="#155fc0" text-anchor="middle" >Pγ</text><rect x="451" y="67" width="179" height="123" rx="12" fill="#fff" stroke="#7543ad" stroke-width="1.5"/><text x="475" y="96" font-size="21" fill="#7543ad" text-anchor="middle" >Vx</text><line x1="479" y1="166" x2="578" y2="164" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)" /><text x="594" y="171" font-size="21" fill="#155fc0" text-anchor="middle" >v</text><line x1="479" y1="166" x2="554" y2="114" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)" /><text x="592" y="112" font-size="21" fill="#7543ad" text-anchor="middle" >U□v</text><path d="M463 226L727 226L793 387L463 387Z" fill="#edf1f8" stroke="#a9b8c9" stroke-width="1.5"/><path d="M479 191L448 211L448 329L502 353" fill="none" stroke="#52647b" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="507" y1="355" x2="731" y2="355" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)" /><line x1="739" y1="347" x2="739" y2="251" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)" /><line x1="731" y1="243" x2="515" y2="243" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)" /><line x1="507" y1="251" x2="507" y2="347" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)" /><circle cx="507" cy="355" r="6" fill="#14283f"/><text x="491" y="378" font-size="21" fill="#14283f" text-anchor="middle" >x</text><text x="623" y="382" font-size="22" fill="#7543ad" text-anchor="middle">δx<tspan baseline-shift="super" font-size="16">μ</tspan></text><text x="771" y="310" font-size="22" fill="#7543ad" text-anchor="middle">δx<tspan baseline-shift="super" font-size="16">ν</tspan></text><text x="624" y="305" font-size="24" fill="#7543ad" text-anchor="middle" >U□ = P∂□</text><text x="779" y="417" font-size="23" fill="#52647b" text-anchor="middle" >M</text><rect x="51" y="439" width="738" height="43" rx="12" fill="#fff" stroke="#a9b8c9" stroke-width="1.5"/><text x="420" y="468" font-size="25" fill="#14283f" text-anchor="middle">U□ = I + igF<tspan baseline-shift="sub" font-size="17">μν</tspan><tspan> δx</tspan><tspan baseline-shift="super" font-size="17">μ</tspan><tspan> δx</tspan><tspan baseline-shift="super" font-size="17">ν</tspan><tspan> + ⋯</tspan></text></g>
