<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="groups_connection_curvature_title groups_connection_curvature_desc">
<title id="groups_connection_curvature_title">Parallel transport connects fibers; curvature appears around a small loop</title>
<desc id="groups_connection_curvature_desc">Left: points x and y lie in the base space M; their vector spaces V_x and V_y are shown above them and linked to the base by dashed lines. A connection specifies the transport P_gamma from a vector v at x to P_gamma v at y. Right: transport in the positive mu, positive nu, negative mu, negative nu directions around a small rectangle returns to the original fiber and acts by U_square. The inset in that same fiber compares v with U_square v. For D_mu=partial_mu-igA_mu the leading correction is +igF_mu_nu delta x^mu delta x^nu, with fixed distinct mu and nu and no summation. A change of frame alone is not curvature. No metric distance or universal rotation angle in a general gauge fiber is implied.</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#155fc0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b54c13"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7543ad"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#087760"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#52647b"/></marker></defs>
<rect width="840" height="500" rx="18" fill="#f8fafc"/>
