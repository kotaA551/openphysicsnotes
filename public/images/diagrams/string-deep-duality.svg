<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Momentum and winding exchange under circle T-duality</title>
  <desc id="desc">A circle of radius two string lengths and a dual circle of radius one half a string length are drawn to the same relative scale. Blue bars show the unit momentum contribution, one over the radius; orange bars show the unit winding contribution, radius over alpha prime. In inverse string length units the values exchange from one half and two to two and one half. These are mass contributions, not complete state masses.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="920" height="430" rx="18" fill="#fff"/>
  <rect x="20" y="20" width="410" height="390" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="490" y="20" width="410" height="390" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="23" text-anchor="middle">
    <text x="225" y="57">R = 2ℓ<tspan baseline-shift="sub" font-size="16">s</tspan></text>
    <text x="695" y="57">R′ = ℓ<tspan baseline-shift="sub" font-size="16">s</tspan>/2</text>
  </g>
  <circle cx="225" cy="153" r="72" fill="#fff7ed" stroke="#b45309" stroke-width="4"/>
  <circle cx="695" cy="153" r="18" fill="#fff7ed" stroke="#b45309" stroke-width="4"/>
  <g stroke="#475569" stroke-width="1.5">
    <path d="M225 153H297M695 153H713"/>
    <path d="M225 148V158M297 148V158M695 148V158M713 148V158"/>
  </g>
  <g fill="#334155" font-family="Georgia, 'Times New Roman', serif" font-size="18">
    <text x="253" y="145">R</text><text x="685" y="192">R′</text>
  </g>
  <path d="M360 150H561" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle">
    <text x="460" y="119">R ↔ α′/R</text><text x="460" y="184">n ↔ w</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19">
    <g fill="#1d4ed8">
      <text x="45" y="270">(n,w) = (1,0)</text><text x="515" y="270">(n,w) = (1,0)</text>
      <rect x="45" y="282" width="42" height="17" rx="3"/><rect x="515" y="282" width="168" height="17" rx="3"/>
      <text x="410" y="297" text-anchor="end">1/R = 1/(2ℓ<tspan baseline-shift="sub" font-size="13">s</tspan>)</text>
      <text x="880" y="325" text-anchor="end">1/R′ = 2/ℓ<tspan baseline-shift="sub" font-size="13">s</tspan></text>
    </g>
    <g fill="#92400e">
      <text x="45" y="345">(n,w) = (0,1)</text><text x="515" y="345">(n,w) = (0,1)</text>
      <rect x="45" y="357" width="168" height="17" rx="3"/><rect x="515" y="357" width="42" height="17" rx="3"/>
      <text x="410" y="397" text-anchor="end">R/α′ = 2/ℓ<tspan baseline-shift="sub" font-size="13">s</tspan></text>
      <text x="880" y="372" text-anchor="end">R′/α′ = 1/(2ℓ<tspan baseline-shift="sub" font-size="13">s</tspan>)</text>
    </g>
  </g>
</svg>
