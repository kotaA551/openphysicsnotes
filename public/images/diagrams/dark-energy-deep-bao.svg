<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="title desc">
  <title id="title">BAO: transverse and radial geometry</title>
  <desc id="desc">An observer sees a transverse comoving separation under angle theta; a radial separation spans a redshift interval delta z. Both represent the same statistical sound-horizon ruler r d. This is a schematic, not a galaxy map.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="880" height="440" rx="18" fill="#f8fafc"/>
  <g fill="none" stroke="#94a3b8" stroke-width="2"><path d="M110 350L664 94M110 350L716 276"/><path d="M110 350L775 168" stroke-dasharray="7 6"/></g>
  <circle cx="110" cy="350" r="12" fill="#0f172a"/>
  <path d="M226 298A127 127 0 0 1 236 336" fill="none" stroke="#475569" stroke-width="3"/>
  <g stroke-width="6" stroke-linecap="round"><path d="M664 94L716 276" stroke="#b45309"/><path d="M548 230L775 168" stroke="#0369a1"/></g>
  <g fill="#b45309"><circle cx="664" cy="94" r="8"/><circle cx="716" cy="276" r="8"/></g>
  <g fill="#0369a1"><circle cx="548" cy="230" r="8"/><circle cx="775" cy="168" r="8"/></g>
  <path d="M132 390L677 315" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g font-family="system-ui, sans-serif" font-size="26" fill="#0f172a"><text x="247" y="322">θ</text><text x="712" y="130" fill="#92400e">r<tspan baseline-shift="sub" font-size="17">d</tspan></text><text x="586" y="184" fill="#075985">r<tspan baseline-shift="sub" font-size="17">d</tspan>, Δz</text><text x="398" y="389">D<tspan baseline-shift="sub" font-size="17">M</tspan></text><text x="52" y="425">z = 0</text><text x="338" y="67">θ ≈ r<tspan baseline-shift="sub" font-size="17">d</tspan> / D<tspan baseline-shift="sub" font-size="17">M</tspan></text><text x="338" y="108">Δz ≈ H r<tspan baseline-shift="sub" font-size="17">d</tspan> / c</text></g>
</svg>
