<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Black hole temperature and mass</title><desc id="desc">Schwarzschild black holes have Hawking temperature inversely proportional to their mass. Sizes and temperatures are schematic.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="177" cy="173" r="30" fill="#243d48"/><circle cx="493" cy="173" r="80" fill="#243d48"/><text x="177" y="266" fill="#243d48" font-size="22" text-anchor="middle">M₁</text><text x="493" y="284" fill="#243d48" font-size="22" text-anchor="middle">M₂ &gt; M₁</text><text x="177" y="56" fill="#c65a23" font-size="22" text-anchor="middle">T₁</text><text x="493" y="56" fill="#c65a23" font-size="22" text-anchor="middle">T₂ &lt; T₁</text><text x="359" y="333" fill="#243d48" font-size="22" text-anchor="middle">Tₕ = ℏc³ / (8πGMkB)</text></g></svg>
