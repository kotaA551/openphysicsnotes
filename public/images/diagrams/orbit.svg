<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Central force and orbital velocity</title><desc id="desc">An elliptical orbit has its attracting mass at a focus. Force points to the focus; velocity is tangent to the orbit.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="360" cy="185" rx="250" ry="125" fill="none" stroke="#d7e2e5" stroke-width="3"/><circle cx="143.5" cy="185" r="17" fill="#c65a23"/><text x="143" y="228" fill="#c65a23" font-size="22" text-anchor="middle">M</text><circle cx="360" cy="60" r="10" fill="#087f8c"/><text x="380" y="48" fill="#243d48" font-size="22" text-anchor="middle">m</text><path d="M360,60L251,123" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(251,123) rotate(149.97287576678693)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="290" y="123" fill="#c65a23" font-size="22" text-anchor="middle">F</text><path d="M360,60L485,60" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(485,60) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="503" y="67" fill="#087f8c" font-size="22" text-anchor="middle">v</text><path d="M143.5,185L360,60" fill="none" stroke="#7254a3" stroke-width="2" stroke-dasharray="5 5"/><text x="231" y="92" fill="#7254a3" font-size="22" text-anchor="middle">r</text><text x="395" y="340" fill="#243d48" font-size="22" text-anchor="middle">F ∥ −r     L = r × mv</text></g></svg>
