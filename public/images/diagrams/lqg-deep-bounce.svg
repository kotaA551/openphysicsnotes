<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Effective massless scalar bounce in loop quantum cosmology</title>
<desc id="desc">Two plots share the dimensionless time axis t over t B from minus three to three. The upper curve a over a B equals one plus time squared to the one sixth power and has minimum one at zero. The lower density ratio equals one divided by one plus time squared and has maximum one at zero. These are effective model functions, not observations.</desc>
