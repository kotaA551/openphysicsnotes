<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Photoelectric threshold</title><desc id="desc">Maximum electron kinetic energy rises linearly with frequency above the threshold nu zero, with slope h.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M80,290L660,290" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(660,290) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M80,290L80,40" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(80,40) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="672" y="320" fill="#243d48" font-size="22" text-anchor="middle">ν</text><text x="52" y="35" fill="#243d48" font-size="22" text-anchor="middle">Kmax</text><path d="M235,290L591,70" fill="none" stroke="#087f8c" stroke-width="4"/><circle cx="235" cy="290" r="5" fill="#087f8c"/><text x="235" y="321" fill="#243d48" font-size="22" text-anchor="middle">ν₀</text><text x="416" y="70" fill="#243d48" font-size="22" text-anchor="middle">Kmax = hν − Φ</text><path d="M235,278L235,301" fill="none" stroke="#243d48" stroke-width="2"/><text x="428" y="252" fill="#243d48" font-size="22" text-anchor="middle">hν₀ = Φ</text><text x="155" y="278" fill="#7254a3" font-size="22" text-anchor="middle">∅</text></g></svg>
