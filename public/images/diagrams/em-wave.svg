<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Transverse electromagnetic fields</title><desc id="desc">At one point in a plane wave, the electric field, magnetic field, and propagation direction are mutually perpendicular.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M300,230L300,75" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(300,75) rotate(-90)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="303" y="55" fill="#c65a23" font-size="22" text-anchor="middle">E</text><path d="M300,230L164,301" fill="none" stroke="#7254a3" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(164,301) rotate(152.43279249908437)" fill="none" stroke="#7254a3" stroke-width="3"/><text x="144" y="313" fill="#7254a3" font-size="22" text-anchor="middle">B</text><path d="M300,230L594,230" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(594,230) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="614" y="237" fill="#087f8c" font-size="22" text-anchor="middle">k</text><circle cx="300" cy="230" r="6" fill="#243d48"/><text x="460" y="90" fill="#243d48" font-size="22" text-anchor="middle">E ⟂ B ⟂ k</text><text x="474" y="133" fill="#243d48" font-size="22" text-anchor="middle">S ∝ E × B</text><text x="474" y="330" fill="#243d48" font-size="22" text-anchor="middle">|E| = c|B|</text></g></svg>
