<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="groups_tangent_exponential_title groups_tangent_exponential_desc">
<title id="groups_tangent_exponential_title">The exponential maps a tangent algebra to the circle group</title>
<desc id="groups_tangent_exponential_desc">On the left, the Lie algebra u(1)=iR is a straight real vector space, identified with the vertical tangent line at the identity 1 of the circle on the right. Two vectors i pi/2 and i 5pi/2 have the same image i under the exponential. The exponential is locally invertible at zero but is not globally one to one. The vertical scale on the algebra axis is linear.</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#155fc0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b54c13"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7543ad"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#087760"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#52647b"/></marker></defs>
<rect width="840" height="500" rx="18" fill="#f8fafc"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round" xml:space="preserve"><text x="420" y="41" font-size="29" fill="#14283f" text-anchor="middle" >exp : u(1) → U(1)</text><line x1="180" y1="356" x2="180" y2="66" stroke="#52647b" stroke-width="2" marker-end="url(#muted-arrow)" /><circle cx="180" cy="356" r="5" fill="#14283f"/><text x="180" y="399" font-size="25" fill="#14283f" text-anchor="middle" >u(1) = iℝ</text><text x="158" y="364" font-size="22" fill="#52647b" text-anchor="end" >0</text><circle cx="180" cy="302" r="7" fill="#155fc0"/><text x="158" y="310" font-size="23" fill="#155fc0" text-anchor="end" >i(π/2)</text><circle cx="180" cy="86" r="7" fill="#7543ad"/><text x="158" y="94" font-size="23" fill="#7543ad" text-anchor="end" >i(5π/2)</text><circle cx="569" cy="243" r="112" fill="none" stroke="#155fc0" stroke-width="3"/><line x1="438" y1="243" x2="730" y2="243" stroke="#a9b8c9" stroke-width="2" /><line x1="569" y1="370" x2="569" y2="111" stroke="#a9b8c9" stroke-width="2" /><circle cx="681" cy="243" r="6" fill="#b54c13"/><text x="699" y="274" font-size="24" fill="#b54c13" text-anchor="middle" >1</text><line x1="681" y1="334" x2="681" y2="151" stroke="#b54c13" stroke-width="2" stroke-dasharray="5 5"/><line x1="681" y1="243" x2="681" y2="188" stroke="#b54c13" stroke-width="3" marker-end="url(#orange-arrow)" /><text x="706" y="157" font-size="22" fill="#b54c13" text-anchor="middle" >T₁U(1)</text><circle cx="569" cy="131" r="8" fill="#155fc0"/><text x="591" y="126" font-size="25" fill="#155fc0" text-anchor="middle" >i</text><path d="M192 302C333 302 354 152 552 133" fill="none" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M192 86C335 53 440 76 552 125" fill="none" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)"/><text x="364" y="116" font-size="23" fill="#7543ad" text-anchor="middle" >exp</text><text x="365" y="253" font-size="23" fill="#155fc0" text-anchor="middle" >exp</text><text x="569" y="399" font-size="25" fill="#14283f" text-anchor="middle" >U(1)</text><rect x="66" y="425" width="708" height="53" rx="12" fill="#fff" stroke="#a9b8c9" stroke-width="1.5"/><text x="420" y="460" font-size="26" fill="#14283f" text-anchor="middle" >exp(iπ/2) = exp(i5π/2) = i</text></g>
</svg>
