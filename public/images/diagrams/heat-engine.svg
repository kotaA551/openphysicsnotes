<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Heat engine energy flow</title><desc id="desc">Heat Qh enters from a hot reservoir, work W leaves the engine, and heat Qc reaches a cold reservoir.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="240" y="32" width="230" height="58" rx="8" fill="#fae9dd"/><text x="355" y="69" fill="#c65a23" font-size="22" text-anchor="middle">Tₕ</text><rect x="265" y="151" width="180" height="61" rx="8" fill="#e4f3f3"/><text x="355" y="189" fill="#243d48" font-size="22" text-anchor="middle">ΔU = 0</text><rect x="240" y="276" width="230" height="56" rx="8" fill="#e6edf7"/><text x="355" y="313" fill="#7254a3" font-size="22" text-anchor="middle">T꜀</text><path d="M355,92L355,148" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(355,148) rotate(90)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="399" y="126" fill="#c65a23" font-size="22" text-anchor="middle">Qₕ</text><path d="M355,215L355,273" fill="none" stroke="#7254a3" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(355,273) rotate(90)" fill="none" stroke="#7254a3" stroke-width="3"/><text x="399" y="254" fill="#7254a3" font-size="22" text-anchor="middle">Q꜀</text><path d="M448,181L586,181" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(586,181) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="610" y="188" fill="#087f8c" font-size="22" text-anchor="middle">W</text><text x="118" y="183" fill="#243d48" font-size="22" text-anchor="middle">Tₕ &gt; T꜀</text><text x="570" y="290" fill="#243d48" font-size="20" text-anchor="middle">W = Qₕ − Q꜀</text></g></svg>
