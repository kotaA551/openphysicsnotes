<svg xmlns="http://www.w3.org/2000/svg" width="840" height="545" viewBox="0 0 840 545" role="img" aria-labelledby="groups_standard_model_title groups_standard_model_desc">
<title id="groups_standard_model_title">Standard Model gauge fields and electroweak mixing</title>
<desc id="groups_standard_model_desc">Before electroweak symmetry breaking there are eight gluon gauge fields for SU(3)_c, three W fields for SU(2)_L, and one B field for U(1)_Y: twelve generators in total. A nonzero Higgs expectation value leaves color and electromagnetism unbroken. W1 and W2 combine into charged W plus and W minus. W3 and B mix into the photon A and the Z boson. With Q=T3+Y, tan(theta_W)=g prime/g; A=sin(theta_W)W3+cos(theta_W)B and Z=cos(theta_W)W3-sin(theta_W)B. This is a field-basis diagram, not a derivation of the Higgs mechanism.</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#155fc0"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b54c13"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7543ad"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#087760"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#52647b"/></marker></defs>
<rect width="840" height="545" rx="18" fill="#f8fafc"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round" xml:space="preserve"><text x="420" y="33" font-size="26" fill="#52647b" text-anchor="middle" >8 + 3 + 1 = 12</text><rect x="29" y="53" width="232" height="96" rx="12" fill="#edf6f2" stroke="#087760" stroke-width="1.5"/><text x="145" y="87" font-size="29" fill="#087760" text-anchor="middle" >SU(3)c</text><text x="145" y="126" font-size="23" fill="#14283f" text-anchor="middle" >Gμᵃ   a = 1,…,8</text><rect x="280" y="53" width="310" height="96" rx="12" fill="#e7effc" stroke="#155fc0" stroke-width="1.5"/><text x="435" y="87" font-size="29" fill="#155fc0" text-anchor="middle" >SU(2)L</text><text x="435" y="126" font-size="23" fill="#14283f" text-anchor="middle" >Wμ¹    Wμ²    Wμ³</text><rect x="609" y="53" width="202" height="96" rx="12" fill="#f5eaff" stroke="#7543ad" stroke-width="1.5"/><text x="710" y="87" font-size="29" fill="#7543ad" text-anchor="middle" >U(1)Y</text><text x="710" y="126" font-size="25" fill="#14283f" text-anchor="middle" >Bμ</text><line x1="145" y1="158" x2="145" y2="300" stroke="#087760" stroke-width="3" marker-end="url(#green-arrow)" /><line x1="380" y1="158" x2="380" y2="300" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)" /><text x="394" y="211" font-size="22" fill="#155fc0" text-anchor="start" >W¹, W²</text><path d="M540 158L540 209L620 259" fill="none" stroke="#155fc0" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M710 158L710 209L638 259" fill="none" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)"/><text x="531" y="190" font-size="21" fill="#155fc0" text-anchor="end" >W³</text><text x="722" y="190" font-size="21" fill="#7543ad" text-anchor="start" >B</text><rect x="571" y="256" width="117" height="45" rx="12" fill="#fff" stroke="#a9b8c9" stroke-width="1.5"/><text x="629" y="286" font-size="23" fill="#14283f" text-anchor="middle" >θW</text><line x1="601" y1="306" x2="562" y2="329" stroke="#b54c13" stroke-width="3" marker-end="url(#orange-arrow)" /><line x1="659" y1="306" x2="705" y2="329" stroke="#7543ad" stroke-width="3" marker-end="url(#purple-arrow)" /><rect x="41" y="316" width="208" height="59" rx="12" fill="#edf6f2" stroke="#087760" stroke-width="1.5"/><text x="145" y="354" font-size="25" fill="#087760" text-anchor="middle" >G¹,…,G⁸</text><rect x="290" y="316" width="178" height="59" rx="12" fill="#e7effc" stroke="#155fc0" stroke-width="1.5"/><text x="379" y="354" font-size="27" fill="#155fc0" text-anchor="middle" >W⁺, W⁻</text><rect x="508" y="335" width="98" height="49" rx="12" fill="#fff0e8" stroke="#b54c13" stroke-width="1.5"/><text x="557" y="368" font-size="27" fill="#b54c13" text-anchor="middle" >A</text><rect x="666" y="335" width="98" height="49" rx="12" fill="#f5eaff" stroke="#7543ad" stroke-width="1.5"/><text x="715" y="368" font-size="27" fill="#7543ad" text-anchor="middle" >Z</text><text x="379" y="410" font-size="23" fill="#155fc0" text-anchor="middle" >W± = (W¹ ∓ iW²)/√2</text><text x="420" y="451" font-size="23" fill="#14283f" text-anchor="middle" >A = sW W³ + cW B       Z = cW W³ − sW B</text><text x="420" y="486" font-size="22" fill="#52647b" text-anchor="middle" >sW = sin θW    cW = cos θW    tan θW = g′/g</text><text x="420" y="522" font-size="24" fill="#14283f" text-anchor="middle" >Q = T₃ + Y      ⟨H⟩ ≠ 0 : SU(3)c × U(1)em</text></g>
</svg>
