<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Plane Couette flow</title><desc id="desc">Between a stationary lower plate and a moving upper plate, steady laminar velocity grows linearly with height. This illustrates viscous shear and no slip.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M100,85L620,85" fill="none" stroke="#243d48" stroke-width="5"/><path d="M100,275L620,275" fill="none" stroke="#243d48" stroke-width="5"/><text x="110" y="63" fill="#087f8c" font-size="22" text-anchor="middle">u = U</text><text x="110" y="313" fill="#243d48" font-size="22" text-anchor="middle">u = 0</text><path d="M220,244L277,244" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(277,244) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,213L334,213" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(334,213) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,182L391,182" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(391,182) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,151L448,151" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(448,151) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,120L505,120" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(505,120) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,275L562,89" fill="none" stroke="#c65a23" stroke-width="2" stroke-dasharray="5 5"/><path d="M610,60L680,60" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(680,60) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="390" y="335" fill="#243d48" font-size="21" text-anchor="middle">u(y) = Uy/h     τxy = μU/h</text></g></svg>
