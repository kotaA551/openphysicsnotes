<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">The holographic source dictionary and two independent approximation controls</title>
  <desc id="desc">A schematic bulk spatial disk has a boundary source phi zero and an interior field phi. To the right, one box relates large lambda to a large curvature radius in string length units. A separate box relates small string coupling to lambda much smaller than four pi times the number of colors. Both controls are needed for the classical supergravity approximation; the disk is a schematic slice rather than an observation.</desc>
  <defs>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <radialGradient id="bulk"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></radialGradient>
  </defs>
  <rect width="920" height="430" rx="18" fill="#fff"/>
  <circle cx="228" cy="198" r="125" fill="url(#bulk)" stroke="#5b21b6" stroke-width="5"/>
  <g fill="none" stroke="#93c5fd" stroke-width="1.2">
    <ellipse cx="228" cy="198" rx="125" ry="46"/>
    <ellipse cx="228" cy="198" rx="55" ry="125"/>
    <path d="M106 169Q228 112 350 169M106 227Q228 284 350 227"/>
  </g>
  <circle cx="316.4" cy="109.6" r="7" fill="#5b21b6" stroke="#fff" stroke-width="2"/>
  <path d="M310 122Q298 164 244 198" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#tip)"/>
  <circle cx="228" cy="211" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0f172a" text-anchor="middle">
    <text x="228" y="219" font-size="29">φ</text>
    <text x="347" y="98" font-size="26">φ<tspan baseline-shift="sub" font-size="17">0</tspan></text>
    <text x="228" y="363" font-size="22">φ|<tspan baseline-shift="sub" font-size="16">∂</tspan> = φ<tspan baseline-shift="sub" font-size="16">0</tspan></text>
    <text x="228" y="398" font-size="19">Z<tspan baseline-shift="sub" font-size="13">string</tspan>[φ<tspan baseline-shift="sub" font-size="13">0</tspan>] = Z<tspan baseline-shift="sub" font-size="13">CFT</tspan>[φ<tspan baseline-shift="sub" font-size="13">0</tspan>]</text>
  </g>
  <rect x="465" y="43" width="420" height="146" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="465" y="234" width="420" height="146" rx="13" fill="#f5f3ff" stroke="#c4b5fd"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0f172a" text-anchor="middle">
    <text x="675" y="87" font-size="23">L/ℓ<tspan baseline-shift="sub" font-size="16">s</tspan> = λ<tspan baseline-shift="super" font-size="16">1/4</tspan></text>
    <text x="675" y="151" font-size="29">λ ≫ 1 ⇒ L ≫ ℓ<tspan baseline-shift="sub" font-size="19">s</tspan></text>
    <text x="675" y="278" font-size="23">g<tspan baseline-shift="sub" font-size="16">s</tspan> = λ/(4πN<tspan baseline-shift="sub" font-size="16">c</tspan>)</text>
    <text x="675" y="342" font-size="28">g<tspan baseline-shift="sub" font-size="19">s</tspan> ≪ 1 ⇒ λ ≪ 4πN<tspan baseline-shift="sub" font-size="19">c</tspan></text>
  </g>
  <text x="675" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#334155" text-anchor="middle">∧</text>
</svg>
