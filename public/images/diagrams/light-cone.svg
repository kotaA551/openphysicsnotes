<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Light cone in one spatial dimension</title><desc id="desc">With metric signature plus minus minus minus, timelike intervals lie inside the light cone, spacelike intervals outside, and lightlike intervals on its boundary.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M360 180L220 40L500 40ZM360 180L220 320L500 320Z" fill="#e4f3f3"/><path d="M105,180L650,180" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(650,180) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M360,325L360,28" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(360,28) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M220,40L500,320" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M220,320L500,40" fill="none" stroke="#c65a23" stroke-width="3"/><text x="665" y="188" fill="#243d48" font-size="22" text-anchor="middle">x</text><text x="379" y="28" fill="#243d48" font-size="22" text-anchor="middle">ct</text><text x="360" y="86" fill="#087f8c" font-size="20" text-anchor="middle">ds² &gt; 0</text><text x="582" y="148" fill="#243d48" font-size="20" text-anchor="middle">ds² &lt; 0</text><text x="537" y="51" fill="#c65a23" font-size="20" text-anchor="middle">ds² = 0</text><text x="190" y="340" fill="#243d48" font-size="20" text-anchor="middle">ds² = c²dt² − dx²</text></g></svg>
