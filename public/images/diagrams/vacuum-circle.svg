<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Continuous symmetry and vacuum manifold</title><desc id="desc">The minima of a complex scalar potential form a circle in field space. Radial and angular perturbations are distinct; the angular direction is flat for the global symmetry.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M135,192L542,192" fill="none" stroke="#d7e2e5" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(542,192) rotate(0)" fill="none" stroke="#d7e2e5" stroke-width="3"/><path d="M340,294L340,41" fill="none" stroke="#d7e2e5" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(340,41) rotate(-90)" fill="none" stroke="#d7e2e5" stroke-width="3"/><circle cx="340" cy="192" r="102" fill="none" stroke="#087f8c" stroke-width="5"/><circle cx="442" cy="192" r="8" fill="#c65a23"/><path d="M442,192L555,192" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(555,192) rotate(0)" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M442,192L442,100" fill="none" stroke="#7254a3" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(442,100) rotate(-90)" fill="none" stroke="#7254a3" stroke-width="3"/><text x="550" y="172" fill="#c65a23" font-size="22" text-anchor="middle">δρ</text><text x="468" y="102" fill="#7254a3" font-size="22" text-anchor="middle">δθ</text><text x="340" y="32" fill="#243d48" font-size="18" text-anchor="middle">Im φ</text><text x="560" y="223" fill="#243d48" font-size="18" text-anchor="middle">Re φ</text><text x="339" y="335" fill="#243d48" font-size="21" text-anchor="middle">|φ| = v/√2     V = const.</text></g></svg>
