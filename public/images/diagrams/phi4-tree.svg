<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Real scalar phi-four tree-level scattering</title>
  <desc id="desc">Four undirected scalar external legs meet at one vertex with factor minus i lambda. Incoming momenta p1 and p2 are on the left, outgoing p3 and p4 on the right. No internal propagator or loop is present.</desc>
  <rect x="1" y="1" width="718" height="438" rx="18" fill="#f8fafc" stroke="#c8d3df" stroke-width="2"/>
  <g fill="none" stroke="#172b3a" stroke-width="4" stroke-linecap="round">
    <path id="scalar-p1" d="M140 100 L360 215"/>
    <path id="scalar-p2" d="M140 330 L360 215"/>
    <path id="scalar-p3" d="M360 215 L580 100"/>
    <path id="scalar-p4" d="M360 215 L580 330"/>
  </g>
  <circle id="quartic-vertex" cx="360" cy="215" r="7" fill="#075985"/>
  <g fill="#172b3a" font-family="Georgia,serif" font-size="32" text-anchor="middle">
    <text x="135" y="75">p₁</text>
    <text x="135" y="375">p₂</text>
    <text x="585" y="75">p₃</text>
    <text x="585" y="375">p₄</text>
    <text x="360" y="168" fill="#075985">−iλ</text>
    <text x="360" y="407" font-size="28">p₁ + p₂ = p₃ + p₄</text>
  </g>
</svg>
