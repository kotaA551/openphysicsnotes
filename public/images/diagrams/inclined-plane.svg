<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Forces on a frictionless incline</title><desc id="desc">Weight acts vertically downward; the normal force is perpendicular to the slope. The tangential weight is mg sin theta.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M90 300L580 300L580 80Z" fill="#e4f3f3" stroke="#d7e2e5" stroke-width="2"/><g transform="translate(340 188) rotate(-24.18)"><rect x="-28" y="-40" width="56" height="40" rx="8" fill="#087f8c"/></g><path d="M330,168L330,282" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(330,282) rotate(90)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="360" y="270" fill="#c65a23" font-size="22" text-anchor="middle">mg</text><path d="M330,168L285,70" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(285,70) rotate(-114.66381471246356)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="264" y="65" fill="#087f8c" font-size="22" text-anchor="middle">N</text><path d="M330,168L216,219" fill="none" stroke="#7254a3" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(216,219) rotate(155.89776549883888)" fill="none" stroke="#7254a3" stroke-width="3"/><text x="208" y="196" fill="#7254a3" font-size="22" text-anchor="middle">mg sin θ</text><text x="155" y="287" fill="#243d48" font-size="22" text-anchor="middle">θ</text><text x="515" y="340" fill="#243d48" font-size="22" text-anchor="middle">a = g sin θ</text></g></svg>
