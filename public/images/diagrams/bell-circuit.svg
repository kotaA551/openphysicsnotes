<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Bell state preparation</title><desc id="desc">A Hadamard gate on the first zero state followed by controlled NOT prepares the Bell state with equal zero zero and one one amplitudes.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M120,118L595,118" fill="none" stroke="#243d48" stroke-width="2"/><path d="M120,234L595,234" fill="none" stroke="#243d48" stroke-width="2"/><text x="79" y="125" fill="#243d48" font-size="22" text-anchor="middle">|0⟩</text><text x="79" y="241" fill="#243d48" font-size="22" text-anchor="middle">|0⟩</text><rect x="199" y="87" width="62" height="62" rx="8" fill="#e4f3f3"/><text x="230" y="126" fill="#243d48" font-size="22" text-anchor="middle">H</text><path d="M395,118L395,234" fill="none" stroke="#087f8c" stroke-width="3"/><circle cx="395" cy="118" r="9" fill="#087f8c"/><circle cx="395" cy="234" r="22" fill="#fbfdfd" stroke="#087f8c" stroke-width="3"/><path d="M373,234L417,234" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M395,212L395,256" fill="none" stroke="#087f8c" stroke-width="3"/><text x="361" y="327" fill="#243d48" font-size="22" text-anchor="middle">|Φ⁺⟩ = (|00⟩ + |11⟩)/√2</text></g></svg>
