<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Lorentz boosted axes</title><desc id="desc">The moving time axis is x equals beta ct and its spatial axis is ct equals beta x. Light rays remain at forty five degrees.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M130,285L640,285" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(640,285) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M130,285L130,35" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(130,35) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M130,285L365,50" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><path d="M130,285L233,40" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(233,40) rotate(-67.19771784642296)" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M130,285L645,69" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(645,69) rotate(-22.75402837386732)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="658" y="294" fill="#243d48" font-size="22" text-anchor="middle">x</text><text x="111" y="31" fill="#243d48" font-size="22" text-anchor="middle">ct</text><text x="265" y="43" fill="#087f8c" font-size="22" text-anchor="middle">ct′</text><text x="657" y="60" fill="#c65a23" font-size="22" text-anchor="middle">x′</text><text x="418" y="331" fill="#243d48" font-size="20" text-anchor="middle">β = v/c = 0.42</text></g></svg>
