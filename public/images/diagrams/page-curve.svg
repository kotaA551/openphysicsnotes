<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Radiation entropy and the Page curve</title><desc id="desc">The solid Page curve returns to zero for unitary evaporation of an initially pure system. The dashed semiclassical radiation entropy continues increasing. This is a qualitative comparison.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M80,290L660,290" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(660,290) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><path d="M80,290L80,40" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(80,40) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="672" y="320" fill="#243d48" font-size="22" text-anchor="middle">t</text><text x="52" y="35" fill="#243d48" font-size="22" text-anchor="middle">Srad</text><path d="M80.00,290.00 L150.00,256.00 L220.00,216.00 L290.00,170.00 L350.00,130.00 L390.00,105.00 L435.00,128.00 L480.00,163.00 L525.00,206.00 L565.00,249.00 L600.00,290.00" fill="none" stroke="#087f8c" stroke-width="4"/><path d="M390.00,105.00 L460.00,81.00 L530.00,64.00 L600.00,53.00" fill="none" stroke="#c65a23" stroke-width="3" stroke-dasharray="8 6"/><path d="M390,290L390,105" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><text x="390" y="320" fill="#243d48" font-size="18" text-anchor="middle">tPage</text><text x="605" y="340" fill="#243d48" font-size="18" text-anchor="middle">tevap</text></g></svg>
