<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">S(R) ≈ min(SR coarse, SBH / kB)</title>
  <desc id="desc">A rising dashed radiation entropy crosses a falling dotted black-hole entropy. Their thick lower envelope is the qualitative Page curve. The horizontal axis is time, the vertical axis dimensionless entropy; the intersection is schematic, not a universal lifetime fraction.</desc>
  <rect width="960" height="460" rx="24" fill="#f8fafc"/>
  <g stroke="#e2e8f0" stroke-width="1"><path d="M95 90 H870 M95 165 H870 M95 240 H870 M95 315 H870"/></g>
  <g fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M95 50 V380 H901 M85 61 L95 50 L105 61 M890 370 L901 380 L890 390"/></g>
  <path d="M95 380 C260 348 410 285 535 226 S770 102 855 70" fill="none" stroke="#c2410c" stroke-width="4" stroke-dasharray="12 9"/>
  <path d="M95 75 C275 89 425 139 535 226 S785 320 855 380" fill="none" stroke="#0369a1" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M95 380 C260 348 410 285 535 226 C645 313 785 320 855 380" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linejoin="round"/>
  <path d="M535 236 V380" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="535" cy="226" r="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="4"/>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="24">
    <text x="50" y="64">S</text><text x="909" y="389">t</text><text x="73" y="405">0</text>
    <text x="569" y="71" fill="#c2410c">S<tspan baseline-shift="sub" font-size="17">R</tspan><tspan baseline-shift="super" font-size="17">coarse</tspan></text>
    <text x="193" y="70" fill="#0369a1">S<tspan baseline-shift="sub" font-size="17">BH</tspan> / k<tspan baseline-shift="sub" font-size="17">B</tspan></text>
    <text x="374" y="345" fill="#7c3aed">S(R)</text>
    <text x="506" y="421">t<tspan baseline-shift="sub" font-size="17">Page</tspan></text>
    <text x="828" y="421">t<tspan baseline-shift="sub" font-size="17">evap</tspan></text>
  </g>
</svg>
