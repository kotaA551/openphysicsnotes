<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Simple pendulum</title><desc id="desc">A pendulum is displaced by theta. Tension points toward the pivot and gravity points downward.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M240,45L430,45" fill="none" stroke="#243d48" stroke-width="4"/><path d="M335,45L335,290" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="6 6"/><path d="M335,45L445,236" fill="none" stroke="#243d48" stroke-width="3"/><circle cx="335" cy="45" r="5" fill="#243d48"/><circle cx="445" cy="236" r="16" fill="#087f8c"/><path d="M335 100 A55 55 0 0 0 362.5 92.6" fill="none" stroke="#c65a23" stroke-width="2"/><text x="353" y="126" fill="#243d48" font-size="22" text-anchor="middle">θ</text><text x="414" y="134" fill="#243d48" font-size="22" text-anchor="middle">ℓ</text><path d="M445,236L399,156" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(399,156) rotate(-119.89890183861458)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="439" y="165" fill="#087f8c" font-size="22" text-anchor="middle">T</text><path d="M445,236L445,321" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(445,321) rotate(90)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="478" y="311" fill="#c65a23" font-size="22" text-anchor="middle">mg</text><text x="172" y="325" fill="#243d48" font-size="22" text-anchor="middle">ω₀² = g / ℓ</text></g></svg>
