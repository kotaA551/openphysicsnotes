<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Spring restoring force</title><desc id="desc">The mass is displaced to the right of equilibrium; the restoring force points left.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M105,90L105,260" fill="none" stroke="#243d48" stroke-width="5"/><path d="M105,205L155,205" fill="none" stroke="#243d48" stroke-width="2"/><path d="M155.00,205.00 L167.00,223.00 L183.00,187.00 L199.00,223.00 L215.00,187.00 L231.00,223.00 L247.00,187.00 L263.00,223.00 L279.00,187.00 L295.00,223.00 L311.00,187.00 L327.00,223.00 L343.00,187.00 L360.00,205.00 L405.00,205.00" fill="none" stroke="#243d48" stroke-width="3"/><rect x="405" y="165" width="80" height="80" rx="8" fill="#087f8c"/><text x="445" y="212" fill="#fff" font-size="22" text-anchor="middle">m</text><path d="M310,120L310,282" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><text x="310" y="307" fill="#243d48" font-size="22" text-anchor="middle">0</text><path d="M310,275L445,275" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(445,275) rotate(0)" fill="none" stroke="#243d48" stroke-width="3"/><text x="382" y="304" fill="#243d48" font-size="22" text-anchor="middle">x</text><path d="M440,139L337,139" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(337,139) rotate(180)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="390" y="108" fill="#c65a23" font-size="22" text-anchor="middle">F = −kx</text><text x="557" y="218" fill="#243d48" font-size="22" text-anchor="middle">ω₀² = k/m</text></g></svg>
