<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Hydrogen energy levels</title><desc id="desc">Hydrogen bound energy levels converge toward zero. A downward transition from n equals two to n equals one emits a photon.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M110,310L110,35" fill="none" stroke="#243d48" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(110,35) rotate(-90)" fill="none" stroke="#243d48" stroke-width="3"/><text x="83" y="36" fill="#243d48" font-size="22" text-anchor="middle">E</text><path d="M185,295L495,295" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M495,295L529,295" fill="none" stroke="#d7e2e5" stroke-width="1"/><text x="572" y="302" fill="#243d48" font-size="18" text-anchor="middle">n = 1</text><path d="M185,126.25L495,126.25" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M495,126.25L529,126.25" fill="none" stroke="#d7e2e5" stroke-width="1"/><text x="572" y="133.25" fill="#243d48" font-size="18" text-anchor="middle">n = 2</text><path d="M185,95L495,95" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M495,95L529,109" fill="none" stroke="#d7e2e5" stroke-width="1"/><text x="572" y="116" fill="#243d48" font-size="18" text-anchor="middle">n = 3</text><path d="M185,84.0625L495,84.0625" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M495,84.0625L529,82" fill="none" stroke="#d7e2e5" stroke-width="1"/><text x="572" y="89" fill="#243d48" font-size="18" text-anchor="middle">n = 4</text><path d="M185,70L495,70" fill="none" stroke="#d7e2e5" stroke-width="2" stroke-dasharray="5 5"/><text x="572" y="57" fill="#243d48" font-size="18" text-anchor="middle">E = 0</text><path d="M340,126.25L340,288" fill="none" stroke="#c65a23" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(340,288) rotate(90)" fill="none" stroke="#c65a23" stroke-width="3"/><text x="405" y="215" fill="#c65a23" font-size="22" text-anchor="middle">hν</text><text x="342" y="342" fill="#243d48" font-size="22" text-anchor="middle">hν = E₂ − E₁</text></g></svg>
