<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">R, B: S(R) = S(B) = ln 2; S(RB) = 0</title>
  <desc id="desc">Two separated correlated qubits are individually mixed. The same pair inside a shared collection boundary has zero joint entropy. A connecting curve denotes correlation, not communication.</desc>
  <rect width="960" height="360" rx="24" fill="#f8fafc"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="2">
    <rect x="28" y="28" width="400" height="304" rx="18"/>
    <rect x="532" y="28" width="400" height="304" rx="18"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7">
    <ellipse cx="132" cy="142" rx="66" ry="82"/>
    <ellipse cx="324" cy="142" rx="66" ry="82"/>
  </g>
  <rect x="560" y="54" width="344" height="176" rx="85" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <g fill="none" stroke="#7c3aed" stroke-width="5">
    <path d="M156 142 C195 76 261 76 300 142"/>
    <path d="M660 142 C699 76 765 76 804 142"/>
  </g>
  <g stroke="#0f172a" stroke-width="3">
    <circle cx="132" cy="142" r="28" fill="#bae6fd"/>
    <circle cx="324" cy="142" r="28" fill="#fde68a"/>
    <circle cx="636" cy="142" r="28" fill="#bae6fd"/>
    <circle cx="828" cy="142" r="28" fill="#fde68a"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" text-anchor="middle">
    <g font-size="25" font-weight="600"><text x="132" y="151">R</text><text x="324" y="151">B</text><text x="636" y="151">R</text><text x="828" y="151">B</text></g>
    <g font-size="23"><text x="132" y="265">S(R) = ln 2</text><text x="324" y="265">S(B) = ln 2</text><text x="732" y="265">S(RB) = 0</text></g>
    <g font-size="19" fill="#475569"><text x="228" y="306">ρR = ρB = ½ I</text><text x="732" y="306">|Ψ⟩ = (|00⟩ + |11⟩) / √2</text></g>
  </g>
  <path d="M451 176 H508 M498 166 L508 176 L498 186" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
