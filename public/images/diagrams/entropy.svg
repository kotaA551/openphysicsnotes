<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Free expansion and multiplicity</title><desc id="desc">A gas initially confined to half a container expands into the whole isolated container. More accessible microstates correspond to larger entropy.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="90" y="75" width="210" height="190" rx="8" fill="#e4f3f3"/><rect x="420" y="75" width="210" height="190" rx="8" fill="#e4f3f3"/><path d="M195,75L195,265" fill="none" stroke="#243d48" stroke-width="2" stroke-dasharray="5 5"/><path d="M327,173L393,173" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M-10,-5L0,0L-10,5" transform="translate(393,173) rotate(0)" fill="none" stroke="#087f8c" stroke-width="3"/><text x="360" y="320" fill="#243d48" font-size="22" text-anchor="middle">S = k ln Ω     ΔS ≥ 0</text><circle cx="110" cy="100" r="5" fill="#087f8c"/><circle cx="440" cy="112" r="5" fill="#087f8c"/><circle cx="137" cy="100" r="5" fill="#087f8c"/><circle cx="470" cy="112" r="5" fill="#087f8c"/><circle cx="164" cy="100" r="5" fill="#087f8c"/><circle cx="500" cy="112" r="5" fill="#087f8c"/><circle cx="110" cy="127" r="5" fill="#087f8c"/><circle cx="530" cy="112" r="5" fill="#087f8c"/><circle cx="137" cy="127" r="5" fill="#087f8c"/><circle cx="560" cy="112" r="5" fill="#087f8c"/><circle cx="164" cy="127" r="5" fill="#087f8c"/><circle cx="590" cy="112" r="5" fill="#087f8c"/><circle cx="110" cy="154" r="5" fill="#087f8c"/><circle cx="440" cy="168" r="5" fill="#087f8c"/><circle cx="137" cy="154" r="5" fill="#087f8c"/><circle cx="470" cy="168" r="5" fill="#087f8c"/><circle cx="164" cy="154" r="5" fill="#087f8c"/><circle cx="500" cy="168" r="5" fill="#087f8c"/><circle cx="110" cy="181" r="5" fill="#087f8c"/><circle cx="530" cy="168" r="5" fill="#087f8c"/><circle cx="137" cy="181" r