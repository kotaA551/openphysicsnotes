<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Spin network crossing a surface</title><desc id="desc">A spin network has representation labels on edges and intertwiners at vertices. Edges puncturing a surface contribute to its area eigenvalue.</desc><rect width="720" height="360" rx="16" fill="#fbfdfd"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M400 43L455 72L415 295L360 265Z" fill="#e4f3f3" stroke="#d7e2e5" stroke-width="2"/><text x="475" y="72" fill="#243d48" font-size="22" text-anchor="middle">S</text><path d="M150,98L170,253" fill="none" stroke="#087f8c" stroke-width="3"/><text x="160" y="162.5" fill="#7254a3" font-size="20" text-anchor="middle">½</text><path d="M150,98L325,172" fill="none" stroke="#087f8c" stroke-width="3"/><text x="237.5" y="122" fill="#7254a3" font-size="20" text-anchor="middle">½</text><path d="M170,253L325,172" fill="none" stroke="#087f8c" stroke-width="3"/><text x="247.5" y="199.5" fill="#7254a3" font-size="20" text-anchor="middle">½</text><path d="M325,172L528,100" fill="none" stroke="#087f8c" stroke-width="3"/><text x="426.5" y="123" fill="#7254a3" font-size="20" text-anchor="middle">½</text><path d="M325,172L564,254" fill="none" stroke="#087f8c" stroke-width="3"/><text x="444.5" y="200" fill="#7254a3" font-size="20" text-anchor="middle">½</text><path d="M528,100L564,254" fill="none" stroke="#087f8c" stroke-width="3"/><text x="546" y="164" fill="#7254a3" font-size="20" text-anchor="middle">½</text><circle cx="150" cy="98" r="9" fill="#243d48"/><circle cx="170" cy="253" r="9" fill="#243d48"/><circle cx="325" cy="172" r="9" fill="#243d48"/><circle cx="528" cy="100" r="9" fill="#243d48"/><circle cx="564" cy="254" r="9" fill="#243d48"/><text x="360" y="337" fill="#243d48" font-size="21" text-anchor="middle">A(S) = 8πγℓP² ∑ₚ √(jₚ(jₚ + 1))</text></g></svg>
