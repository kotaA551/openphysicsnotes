<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Two punctures and an area eigenvalue</title>
<desc id="desc">A schematic surface S is crossed transversely by two edges, labeled j equals one half and j equals one. The circular markers are punctures, not graph vertices. Their contributions to area in units of eight pi gamma Planck length squared are square root of three over two and square root of two.</desc>
<rect width="900" height="480" rx="20" fill="#f8fafc"/>
<g fill="none" stroke-linecap="round" stroke-width="7">
<path d="M315 95 L315 352" stroke="#2563eb"/>
<path d="M565 72 L565 345" stroke="#7c3aed"/>
</g>
<path d="M125 218 L605 130 L775 294 L295 382 Z" fill="#dff3f1" stroke="#087f8c" stroke-width="3"/>
<g fill="none" stroke-linecap="round" stroke-width="7">
<path d="M315 95 L315 270" stroke="#2563eb"/>
<path d="M565 72 L565 230" stroke="#7c3aed"/>
<path d="M315 282 L315 352" stroke="#2563eb" stroke-dasharray="7 9" opacity=".65"/>
<path d="M565 242 L565 345" stroke="#7c3aed" stroke-dasharray="7 9" opacity=".65"/>
</g>
<circle cx="315" cy="276" r="9" fill="#fff" stroke="#2563eb" stroke-width="4"/>
<circle cx="565" cy="236" r="9" fill="#fff" stroke="#7c3aed" stroke-width="4"/>
<g font-family="Georgia,serif" font-size="30" fill="#172033">
<text x="342" y="108">j = ½</text>
<text x="592" y="87">j = 1</text>
<text x="675" y="284" font-style="italic">S</text>
<text x="450" y="437" text-anchor="middle">A / (8πγℓₚ²) = √3 / 2 + √2 ≈ 2.280</text>
</g>
</svg>
