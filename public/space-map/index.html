<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Space Map | Solar system</title>  <script type="module" crossorigin src="/space-map/assets/main-D6jEOedA.js"></script>
  <link rel="modulepreload" crossorigin href="/space-map/assets/coordinates-JD4ppqEU.js">
  <link rel="stylesheet" crossorigin href="/space-map/assets/main-BwzyoTND.css">
<script>addEventListener('error',e=>{if(e instanceof ErrorEvent&&parent!==window)parent.postMessage({type:'space-map-error'},location.origin)});addEventListener('unhandledrejection',()=>{if(parent!==window)parent.postMessage({type:'space-map-error'},location.origin)});</script></head><body>
<canvas id="space"></canvas><div id="labels"></div>
<header><b>✦ SPACE MAP</b></header>
<aside id="explore-panel"><button id="panel-toggle" class="mobile-only panel-toggle" aria-expanded="false" aria-controls="panel-content"><span id="mobile-selection">Earth</span><span id="panel-action" class="sr-only">Explore &amp; settings</span><span aria-hidden="true">⌃</span></button><div id="panel-content"><div id="app-error" role="alert"></div>
<label class="body-picker"><select id="object" aria-label="Choose celestial body"></select></label><div class="row"><button id="focus">Visit body</button><button id="system">Solar system</button></div><div class="row"><button id="home">Earth close-up</button><button id="moonview">Earth + Moon</button></div>
<div id="measurements"></div>
<label>Reference frame<select id="frame"><option value="earth">Earth-fixed · Greenwich +X</option><option value="inertial">J2000 equatorial</option></select></label>
<div class="toggles"><label><input id="markers" type="checkbox" checked> Labels / locator markers</label><label><input id="axes" type="checkbox" checked> Earth axes and surface pins</label><label><input id="orbits" type="checkbox" checked> Orbital guides</label></div>
<details open><summary>Where the Earth axes meet the surface</summary><div class="pins"><button data-pin="X">+X · 0° N, 0° E<br><small>Gulf of Guinea</small></button><button data-pin="Y">+Y · 0° N, 90° E<br><small>Indian Ocean</small></button><button data-pin="Z">+Z · North Pole<br><small>90° N</small></button></div><p class="muted">−X: 180° / equator · −Y: 90° W / equator · −Z: South Pole. Pins and grid are surface overlays.</p></details>
<p class="map-credit-link"><a href="/space-map/credits.html" target="_blank" rel="noopener">Credits</a></p>
</div></aside>
<nav aria-label="Map controls"><button id="time-toggle" class="mobile-only" aria-expanded="false" aria-controls="time-panel">Time</button><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset orientation" title="Reset orientation"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10a9 9 0 1 1 2.5 8M3 10V4m0 6h6"/></svg></button></nav>
<section id="time-panel" class="timeline" aria-label="Model time controls"><label class="time-input"><input id="time" aria-label="Model time in UTC" type="datetime-local" min="1900-01-01T00:00" max="2100-12-31T23:59" step="1"></label><button id="play">Play</button><select id="rate" aria-label="Playback speed"><option value="1">1 sec / sec</option><option value="60">1 min / sec</option><option value="3600">1 hour / sec</option></select><button id="now">Now</button></section></body></html>
